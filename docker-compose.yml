services:
  mysql:
    image: mysql:8.0
    container_name: proxy_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-proxy_manager}
      MYSQL_USER: ${DB_USERNAME:-proxy}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - proxy_net

  redis:
    image: redis:7-alpine
    container_name: proxy_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - proxy_net

  php:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: proxy_php
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    environment:
      - APP_ENV=${APP_ENV:-local}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - proxy_net

  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /var/www/html
    command: php artisan queue:work --queue=proxies,default --sleep=3 --tries=3 --timeout=15
    volumes:
      - ./backend:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - proxy_net
    deploy:
      replicas: 5

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: proxy_scheduler
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - ./backend:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - proxy_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: proxy_frontend
    restart: unless-stopped
    networks:
      - proxy_net

  nginx:
    image: nginx:1.25-alpine
    container_name: proxy_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend:/var/www/html:ro
    depends_on:
      - php
      - frontend
    networks:
      - proxy_net

volumes:
  mysql_data:

networks:
  proxy_net:
    driver: bridge